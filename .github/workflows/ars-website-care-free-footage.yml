name: ARS Website Care Source Footage
on:
  push:
    branches: [tools/ars-free-website-care-footage-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch commercially licensed footage from Mixkit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p stock
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1; fi
          command -v ffprobe
          echo 'Testing asset access:'
          for link in 'https://assets.mixkit.co/videos/29993/29993-720.mp4' 'https://assets.mixkit.co/videos/41659/41659-720.mp4' 'https://www.pexels.com/download/video/7989682/'; do
            echo "CHECK $link"
            curl -ILsS --max-time 20 "$link" | head -15 || true
          done
          for row in '25575|problem-owner-frustrated' '41659|technical-work-portrait' '41643|technician-keyboard' '41647|technician-checking' '251|customer-laptop' '42654|customer-verifying' '100315|technician-laptop-green-screen' '100059|customer-phone-green-screen' '100321|typing-laptop-green-screen' '100081|desk-laptop-green-screen'; do
            id=${row%%|*}
            slug=${row##*|}
            success=0
            for res in 720; do
              url="https://assets.mixkit.co/videos/$id/$id-$res.mp4"
              if curl -fLsS --connect-timeout 15 --max-time 70 --retry 1 -w "result %{http_code} / %{size_download} bytes from $url\\n" "$url" -o "stock/$slug.mp4" && ffprobe -v error "stock/$slug.mp4" >/dev/null 2>&1; then
                echo "Downloaded $slug from $url"
                success=1
                break
              fi
              rm -f "stock/$slug.mp4"
            done
            if [ "$success" = 0 ]; then echo "UNAVAILABLE $slug"; fi
          done
          printf '%s\n' 'Mixkit Stock Video Free License: https://mixkit.co/license/modal/videoFree/' > stock/LICENSE_SOURCES.txt
          printf '%s\n' '25575: https://mixkit.co/free-stock-video/young-very-frustrated-woman-in-front-of-her-computer-25575/' '41659: https://mixkit.co/free-stock-video/programmer-working-on-his-computer-41659/' '41643: https://mixkit.co/free-stock-video/experienced-programmer-working-on-a-computer-41643/' '41647: https://mixkit.co/free-stock-video/professional-programmer-working-on-a-large-computer-41647/' '251: https://mixkit.co/free-stock-video/woman-working-on-a-laptop-251/' '42654: https://mixkit.co/free-stock-video/business-woman-concentrating-on-her-laptop-42654/' '100315: https://mixkit.co/free-stock-video/editing-a-green-screen-laptop-display-in-an-office-setting-100315/' '100059: https://mixkit.co/free-stock-video/a-young-woman-relaxing-on-the-couch-with-mobile-phone-100059/' '100321: https://mixkit.co/free-stock-video/hands-typing-on-a-laptop-with-a-green-screen-display-100321/' '100081: https://mixkit.co/free-stock-video/a-laptop-computer-with-a-green-screen-on-an-office-100081/' >> stock/LICENSE_SOURCES.txt
          for pex in '6586059|restore-laptop-green-screen' '4685169|contact-phone-green-screen' '9558751|phone-chroma-vertical'; do
            pid=${pex%%|*}; pslug=${pex##*|}
            purl="https://www.pexels.com/download/video/$pid/"
            echo "Pexels $pid"
            if curl -fLsS --connect-timeout 20 --max-time 150 --retry 1 "$purl" -o "stock/$pslug.mp4" && ffprobe -v error "stock/$pslug.mp4" >/dev/null 2>&1; then
              echo "Downloaded $pslug"
            else
              echo "UNAVAILABLE PEXELS $pid";rm -f "stock/$pslug.mp4"
            fi
          done
          printf '%s\\n' 'Pexels stock licence: https://www.pexels.com/license/' '6586059: https://www.pexels.com/video/person-typing-on-the-laptop-6586059/' '4685169: https://www.pexels.com/video/person-typing-on-a-mobile-phone-4685169/' '9558751: https://www.pexels.com/video/a-person-holding-an-iphone-with-a-green-screen-9558751/' >> stock/LICENSE_SOURCES.txt
          find stock -maxdepth 1 -type f -printf '%f %s bytes\n'
          test "$(find stock -maxdepth 1 -name '*.mp4' | wc -l)" -ge 3
      - uses: actions/upload-artifact@v4
        with:
          name: website-care-source-footage
          path: stock/
          retention-days: 1
          if-no-files-found: error
